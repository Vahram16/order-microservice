# Merge these jobs into the environment Prometheus configuration.
#
# The aggregate endpoint is inexpensive and supplies broker/node/connection churn metrics.
# The detailed endpoint is deliberately restricted to the queue metric families needed by the
# messaging dashboard and alerts. Do not scrape every per-object family on a large cluster.
scrape_configs:
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbitmq:15692

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
        - queue_metrics
    static_configs:
      - targets:
          - rabbitmq:15692
