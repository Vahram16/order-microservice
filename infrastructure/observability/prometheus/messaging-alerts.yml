groups:
  - name: messaging-consumers
    interval: 30s
    rules:
      - alert: MessagingConsumerRetriesSustained
        expr: sum by (service_name, messaging_destination_name) (rate(messaging_consumer_retry_attempts_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
          owner: service-owner
        annotations:
          summary: Consumer retries are sustained
          description: >-
            {{ $labels.service_name }} endpoint {{ $labels.messaging_destination_name }}
            is retrying at {{ printf "%.2f" $value }} attempts/second. Investigate the
            classified transient dependency before delayed redelivery and _error traffic grow.

      - alert: MessagingConsumerRedeliveryDetected
        expr: sum by (service_name, messaging_destination_name) (increase(messaging_consumer_redelivery_attempts_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
          owner: service-owner
        annotations:
          summary: Delayed message redelivery is occurring
          description: >-
            {{ $labels.service_name }} endpoint {{ $labels.messaging_destination_name }}
            exhausted immediate retries and used broker-backed delayed redelivery.

      - alert: MessagingConsumerFailuresDetected
        expr: sum by (service_name, messaging_destination_name, error_type) (increase(messaging_consumer_failures_total[5m])) > 0
        for: 2m
        labels:
          severity: critical
          owner: service-owner
        annotations:
          summary: Consumer attempts are failing
          description: >-
            {{ $labels.service_name }} endpoint {{ $labels.messaging_destination_name }}
            recorded {{ printf "%.0f" $value }} failed attempts in five minutes.
            Error type: {{ $labels.error_type }}.

      - alert: MessagingConsumerLatencyHigh
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le, service_name, messaging_destination_name)
              (rate(messaging_consumer_attempt_duration_seconds_bucket[10m]))
          ) > 5
        for: 10m
        labels:
          severity: warning
          owner: service-owner
        annotations:
          summary: Consumer p95 attempt latency is high
          description: >-
            {{ $labels.service_name }} endpoint {{ $labels.messaging_destination_name }}
            has p95 attempt latency of {{ printf "%.2f" $value }} seconds.

  - name: messaging-poison-queues
    interval: 30s
    rules:
      - alert: MessagingErrorQueueNotEmpty
        expr: sum by (vhost, queue) (rabbitmq_detailed_queue_messages{queue=~".*_error"}) > 0
        for: 2m
        labels:
          severity: critical
          owner: service-owner
        annotations:
          summary: MassTransit error queue contains messages
          description: >-
            RabbitMQ queue {{ $labels.vhost }}/{{ $labels.queue }} contains
            {{ printf "%.0f" $value }} poison messages. Follow the bounded replay runbook;
            never shovel the queue back automatically.

      - alert: MessagingSkippedQueueNotEmpty
        expr: sum by (vhost, queue) (rabbitmq_detailed_queue_messages{queue=~".*_skipped"}) > 0
        for: 2m
        labels:
          severity: critical
          owner: service-owner
        annotations:
          summary: MassTransit skipped queue contains messages
          description: >-
            RabbitMQ queue {{ $labels.vhost }}/{{ $labels.queue }} contains
            {{ printf "%.0f" $value }} skipped messages. Treat this separately from consumer
            failures; investigate routing, endpoint topology, and contract compatibility.

      - alert: MessagingQueueOldestMessageHigh
        expr: >-
          (
            time() - rabbitmq_detailed_queue_head_message_timestamp{
              queue!~".*_(error|skipped)"
            }
          ) > 300
          and on (vhost, queue)
          rabbitmq_detailed_queue_messages{queue!~".*_(error|skipped)"} > 0
        for: 10m
        labels:
          severity: warning
          owner: service-owner
        annotations:
          summary: Oldest queued message exceeds five minutes
          description: >-
            RabbitMQ queue {{ $labels.vhost }}/{{ $labels.queue }} has an oldest message age
            of {{ printf "%.0f" $value }} seconds.

      - alert: MessagingFaultQueueOldestMessageHigh
        expr: >-
          (
            time() - rabbitmq_detailed_queue_head_message_timestamp{
              queue=~".*_(error|skipped)"
            }
          ) > 900
          and on (vhost, queue)
          rabbitmq_detailed_queue_messages{queue=~".*_(error|skipped)"} > 0
        for: 10m
        labels:
          severity: critical
          owner: service-owner
        annotations:
          summary: Fault queue message has remained unowned
          description: >-
            RabbitMQ queue {{ $labels.vhost }}/{{ $labels.queue }} has an oldest message age
            above fifteen minutes. Confirm incident ownership and retention handling.

  - name: messaging-outbox
    interval: 30s
    rules:
      - alert: MessagingOutboxBacklogHigh
        expr: max by (service_name, db_context) (messaging_outbox_backlog) > 100
        for: 5m
        labels:
          severity: warning
          owner: service-owner
        annotations:
          summary: PostgreSQL outbox backlog is high
          description: >-
            {{ $labels.service_name }} context {{ $labels.db_context }} has
            {{ printf "%.0f" $value }} pending outbox messages.

      - alert: MessagingOutboxDeliveryAgeHigh
        expr: max by (service_name, db_context) (messaging_outbox_oldest_age_seconds) > 60
        for: 5m
        labels:
          severity: critical
          owner: service-owner
        annotations:
          summary: PostgreSQL outbox delivery is stale
          description: >-
            {{ $labels.service_name }} context {{ $labels.db_context }} has an oldest pending
            outbox message age of {{ printf "%.0f" $value }} seconds.

      - alert: MessagingOutboxMetricsCollectionFailed
        expr: sum by (service_name, db_context) (increase(messaging_outbox_collection_failures_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
          owner: service-owner
        annotations:
          summary: Outbox metrics collection is failing
          description: >-
            {{ $labels.service_name }} cannot query outbox state for
            {{ $labels.db_context }}. This commonly indicates a PostgreSQL outage or schema issue.

  - name: rabbitmq-connectivity
    interval: 30s
    rules:
      - alert: RabbitMqMetricsUnavailable
        expr: up{job=~"rabbitmq.*"} == 0
        for: 2m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: RabbitMQ metrics endpoint is unavailable
          description: >-
            Prometheus cannot scrape RabbitMQ target {{ $labels.instance }} for two minutes.
            Correlate with application readiness and broker cluster health.

      - alert: RabbitMqConnectionsClosingRapidly
        expr: increase(rabbitmq_connections_closed_total[5m]) > 3
        for: 5m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: RabbitMQ connections are closing repeatedly
          description: >-
            RabbitMQ closed {{ printf "%.0f" $value }} connections in five minutes.
            Investigate broker, network, TLS, and client recovery logs.

      - alert: RabbitMqConnectionsOpeningRapidly
        expr: increase(rabbitmq_connections_opened_total[5m]) > 3
        for: 5m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: RabbitMQ connections are reopening repeatedly
          description: >-
            RabbitMQ opened {{ printf "%.0f" $value }} connections in five minutes,
            indicating reconnect churn or unstable clients.
