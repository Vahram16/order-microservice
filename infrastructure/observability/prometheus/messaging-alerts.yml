groups:
  - name: messaging-reliability
    interval: 30s
    rules:
      - alert: MessagingConsumerRetriesSustained
        expr: >-
          sum by (service_name, messaging_destination_name)
            (rate(messaging_consumer_retry_attempts_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
          owner: service-owner
        annotations:
          summary: Consumer retries are sustained
          description: >-
            {{ $labels.service_name }} endpoint {{ $labels.messaging_destination_name }}
            is retrying continuously. Investigate the owning dependency and consumer logs.

      - alert: MessagingErrorQueueNotEmpty
        expr: >-
          sum by (vhost, queue)
            (rabbitmq_detailed_queue_messages{queue=~".*_error$"}) > 0
        for: 2m
        labels:
          severity: critical
          owner: service-owner
        annotations:
          summary: A MassTransit error queue is not empty
          description: >-
            RabbitMQ queue {{ $labels.vhost }}/{{ $labels.queue }} contains
            {{ printf "%.0f" $value }} terminally failed messages.

      - alert: MessagingSkippedQueueNotEmpty
        expr: >-
          sum by (vhost, queue)
            (rabbitmq_detailed_queue_messages{queue=~".*_skipped$"}) > 0
        for: 2m
        labels:
          severity: critical
          owner: service-owner
        annotations:
          summary: A MassTransit skipped queue is not empty
          description: >-
            RabbitMQ queue {{ $labels.vhost }}/{{ $labels.queue }} contains
            {{ printf "%.0f" $value }} messages with no matching consumer.

      - alert: MessagingOutboxBacklogHigh
        expr: >-
          max by (service_name, db_context)
            (messaging_outbox_backlog) > 100
        for: 5m
        labels:
          severity: warning
          owner: service-owner
        annotations:
          summary: PostgreSQL outbox backlog is high
          description: >-
            {{ $labels.service_name }} context {{ $labels.db_context }} has
            {{ printf "%.0f" $value }} pending outbox messages.

      - alert: MessagingOutboxOldestMessageHigh
        expr: >-
          max by (service_name, db_context)
            (messaging_outbox_oldest_age_seconds) > 60
        for: 5m
        labels:
          severity: critical
          owner: service-owner
        annotations:
          summary: PostgreSQL outbox delivery is stale
          description: >-
            {{ $labels.service_name }} context {{ $labels.db_context }} has an oldest pending
            message age of {{ printf "%.0f" $value }} seconds.

      - alert: MessagingOutboxCollectionFailuresDetected
        expr: >-
          sum by (service_name, db_context)
            (increase(messaging_outbox_collection_failures_total[10m])) > 0
        for: 2m
        labels:
          severity: warning
          owner: service-owner
        annotations:
          summary: Outbox metrics collection failed
          description: >-
            {{ $labels.service_name }} encountered outbox collection failures for
            {{ $labels.db_context }}. This is an observability failure and does not control
            application readiness.

  - name: rabbitmq-connectivity
    interval: 30s
    rules:
      - alert: RabbitMqMetricsUnavailable
        expr: up{job=~"rabbitmq.*"} == 0
        for: 2m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: RabbitMQ metrics endpoint is unavailable
          description: >-
            Prometheus cannot scrape RabbitMQ target {{ $labels.instance }} for two minutes.

      - alert: RabbitMqConnectionChurn
        expr: >-
          increase(rabbitmq_connections_closed_total[5m]) > 3
          or increase(rabbitmq_connections_opened_total[5m]) > 3
        for: 5m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: RabbitMQ connections are changing rapidly
          description: >-
            Investigate broker, network, TLS, and client recovery logs.
