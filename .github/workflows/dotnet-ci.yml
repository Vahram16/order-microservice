name: dotnet-ci

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs
          while IFS= read -r project; do
            dotnet restore "$project" 2>&1 | tee -a Logs/restore.log
          done < <(find src tests -name '*.csproj' -type f | sort)

      - name: Verify API-only identity boundary
        shell: bash
        run: |
          set -euo pipefail
          identity_api="src/Services/Identity/Identity.Api"
          if grep -RInE --include='*.cs' \
            '(text/html|<!doctype[[:space:]]+html|<html([[:space:]>]))' \
            "$identity_api"; then
            echo "Identity.Api must not render application HTML."
            exit 1
          fi

      - name: Build source projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs
          while IFS= read -r project; do
            printf '\n=== %s ===\n' "$project" | tee -a Logs/build.log
            dotnet build "$project" --configuration Release --no-restore 2>&1 \
              | tee -a Logs/build.log
          done < <(find src -name '*.csproj' -type f | sort)

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs
          while IFS= read -r project; do
            printf '\n=== %s ===\n' "$project" | tee -a Logs/test.log
            dotnet test "$project" \
              --configuration Release \
              --no-restore \
              --logger "trx" \
              --results-directory TestResults 2>&1 \
              | tee -a Logs/test.log
          done < <(find tests -name '*.csproj' -type f | sort)

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: |
            Logs/*.log
            TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
