name: dotnet-ci

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs
          while IFS= read -r project; do
            dotnet restore "$project" 2>&1 | tee -a Logs/restore.log
          done < <(find src tests -name '*.csproj' -type f | sort)

      - name: Build source projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs
          while IFS= read -r project; do
            printf '\n=== %s ===\n' "$project" | tee -a Logs/build.log
            dotnet build "$project" --configuration Release --no-restore 2>&1 \
              | tee -a Logs/build.log
          done < <(find src -name '*.csproj' -type f | sort)

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs
          while IFS= read -r project; do
            printf '\n=== %s ===\n' "$project" | tee -a Logs/test.log
            dotnet test "$project" \
              --configuration Release \
              --no-restore \
              --logger "trx" \
              --results-directory TestResults 2>&1 \
              | tee -a Logs/test.log
          done < <(find tests -name '*.csproj' -type f | sort)

      - name: Build production Keycloak image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file infrastructure/keycloak/Containerfile \
            --tag order-keycloak:ci \
            . 2>&1 | tee Logs/keycloak-image.log

      - name: Verify Keycloak development realm
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-keycloak-development.sh 2>&1 \
            | tee Logs/keycloak-development.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: |
            Logs/*.log
            TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
