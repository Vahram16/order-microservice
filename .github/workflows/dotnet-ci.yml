name: dotnet-ci

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUSTOMER_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=customer_ci;Username=postgres;Password=postgres
      PRODUCT_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=product_ci;Username=postgres;Password=postgres
      MESSAGING_TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=messaging_ci;Username=postgres;Password=postgres
      MESSAGING_TEST_RABBITMQ_CONNECTION_STRING: amqp://guest:guest@localhost:5672/
      MESSAGING_TEST_RABBITMQ_API: http://localhost:15672
      MESSAGING_TEST_RABBITMQ_USERNAME: guest
      MESSAGING_TEST_RABBITMQ_PASSWORD: guest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: customer_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d customer_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate agent context
        shell: bash
        run: python3 scripts/verify-agent-context.py

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Build RabbitMQ test image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs
          docker build \
            --progress=plain \
            --file infrastructure/rabbitmq/Containerfile \
            --tag order-rabbitmq:ci \
            infrastructure/rabbitmq 2>&1 | tee Logs/rabbitmq-image.log

      - name: Start RabbitMQ
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name rabbitmq-ci \
            --publish 5672:5672 \
            --publish 15672:15672 \
            --publish 15692:15692 \
            --env RABBITMQ_DEFAULT_USER=guest \
            --env RABBITMQ_DEFAULT_PASS=guest \
            --env RABBITMQ_ERLANG_COOKIE=messaging-ci-cookie-not-a-secret \
            order-rabbitmq:ci

          for attempt in $(seq 1 30); do
            if ! docker inspect --format '{{.State.Running}}' rabbitmq-ci | grep --quiet true; then
              docker logs rabbitmq-ci
              exit 1
            fi

            if curl --fail --silent --show-error \
              --user guest:guest \
              http://localhost:15672/api/overview >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          docker logs rabbitmq-ci
          exit 1

      - name: Create messaging test database
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="$(docker ps --filter ancestor=postgres:18 --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          docker exec "$postgres_container" psql \
            --username postgres \
            --dbname postgres \
            --command 'CREATE DATABASE messaging_ci;' 2>&1 \
            | tee Logs/messaging-database.log

      - name: Create Product test database
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="$(docker ps --filter ancestor=postgres:18 --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          docker exec "$postgres_container" psql \
            --username postgres \
            --dbname postgres \
            --command 'CREATE DATABASE product_ci;' 2>&1 \
            | tee Logs/product-database.log

      - name: Restore projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs
          while IFS= read -r project; do
            dotnet restore "$project" 2>&1 | tee -a Logs/restore.log
          done < <(find src tests -name '*.csproj' -type f | sort)

      - name: Build source projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs
          while IFS= read -r project; do
            printf '\n=== %s ===\n' "$project" | tee -a Logs/build.log
            dotnet build "$project" --configuration Release --no-restore 2>&1 \
              | tee -a Logs/build.log
          done < <(find src -name '*.csproj' -type f | sort)

      - name: Validate messaging observability artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool \
            infrastructure/observability/grafana/messaging-reliability-dashboard.json \
            >/dev/null

          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$PWD/infrastructure/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.12.0 \
            check rules /etc/prometheus/messaging-alerts.yml 2>&1 \
            | tee Logs/prometheus-rules.log

          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$PWD/infrastructure/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.12.0 \
            check config /etc/prometheus/rabbitmq-scrape.yml 2>&1 \
            | tee Logs/prometheus-config.log

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs
          while IFS= read -r project; do
            printf '\n=== %s ===\n' "$project" | tee -a Logs/test.log
            dotnet test "$project" \
              --configuration Release \
              --no-restore \
              --logger "trx" \
              --results-directory TestResults \
              --blame-hang \
              --blame-hang-timeout 3m \
              --blame-hang-dump-type mini 2>&1 \
              | tee -a Logs/test.log
          done < <(find tests -name '*.csproj' -type f | sort)

      - name: Build production Keycloak image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file infrastructure/keycloak/Containerfile \
            --tag order-keycloak:ci \
            . 2>&1 | tee Logs/keycloak-image.log

      - name: Verify Keycloak development realm
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-keycloak-development.sh 2>&1 \
            | tee Logs/keycloak-development.log

      - name: Capture RabbitMQ diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p Logs
          docker logs rabbitmq-ci > Logs/rabbitmq.log 2>&1 || true
          docker exec rabbitmq-ci rabbitmq-diagnostics status > Logs/rabbitmq-status.log 2>&1 || true
          docker exec rabbitmq-ci rabbitmq-plugins list --enabled > Logs/rabbitmq-plugins.log 2>&1 || true

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: |
            Logs/*.log
            TestResults/**/*
          if-no-files-found: ignore
          retention-days: 14
