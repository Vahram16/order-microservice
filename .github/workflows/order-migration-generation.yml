name: order-migration-generation

on:
  push:
    branches:
      - agent/order-service
    paths:
      - .github/workflows/order-migration-generation.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ConnectionStrings__order-db: Host=localhost;Database=order_design;Username=postgres;Password=postgres
      ConnectionStrings__inventory-db: Host=localhost;Database=inventory_design;Username=postgres;Password=postgres
      ConnectionStrings__product-db: Host=localhost;Database=product_design;Username=postgres;Password=postgres
      ConnectionStrings__payment-db: Host=localhost;Database=payment_design;Username=postgres;Password=postgres
      Security__Authority: https://localhost/realms/order
      Security__Audience: backend-api
      Security__RoleClientId: backend-api
      Security__ValidAuthorizedParties__0: mobile-app
      Security__RequireHttpsMetadata: 'false'
      Stripe__SecretKey: sk_test_migration_generation_only
      Stripe__WebhookSecret: whsec_migration_generation_only
      Messaging__RabbitMq__ConnectionString: amqp://guest:guest@localhost:5672/
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/order-service
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install EF tool
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef --version 10.0.10
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore and build migration projects
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            src/Services/Order/Order.Api/Order.Api.csproj \
            src/Services/Inventory/Inventory.Api/Inventory.Api.csproj \
            src/Services/Product/Product.Api/Product.Api.csproj \
            src/Services/Payment/Payment.Api/Payment.Api.csproj; do
            dotnet restore "$project"
            dotnet build "$project" --configuration Release --no-restore
          done

      - name: Generate migrations
        shell: bash
        run: |
          set -euo pipefail
          dotnet ef migrations add InitialOrder \
            --project src/Services/Order/Order.Api/Order.Api.csproj \
            --startup-project src/Services/Order/Order.Api/Order.Api.csproj \
            --context OrderDbContext \
            --output-dir Persistence/Migrations \
            --configuration Release \
            --no-build

          dotnet ef migrations add InitialInventory \
            --project src/Services/Inventory/Inventory.Api/Inventory.Api.csproj \
            --startup-project src/Services/Inventory/Inventory.Api/Inventory.Api.csproj \
            --context InventoryDbContext \
            --output-dir Persistence/Migrations \
            --configuration Release \
            --no-build

          dotnet ef migrations add AddCheckoutOutbox \
            --project src/Services/Product/Product.Api/Product.Api.csproj \
            --startup-project src/Services/Product/Product.Api/Product.Api.csproj \
            --context ProductDbContext \
            --output-dir Persistence/Migrations \
            --configuration Release \
            --no-build

          dotnet ef migrations add AddOrderPaymentsAndRefunds \
            --project src/Services/Payment/Payment.Api/Payment.Api.csproj \
            --startup-project src/Services/Payment/Payment.Api/Payment.Api.csproj \
            --context PaymentDbContext \
            --output-dir Persistence/Migrations \
            --configuration Release \
            --no-build

      - name: Commit generated migrations and remove generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/Services/Order/Order.Api/Persistence/Migrations \
            src/Services/Inventory/Inventory.Api/Persistence/Migrations \
            src/Services/Product/Product.Api/Persistence/Migrations \
            src/Services/Payment/Payment.Api/Persistence/Migrations
          git rm .github/workflows/order-migration-generation.yml
          git diff --cached --check
          git commit -m "Add generated checkout persistence migrations"
          git push origin HEAD:agent/order-service
